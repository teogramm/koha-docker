version: "3.9"

services:
  koha:
    image: teogramm/koha:24.11
    # Cargar variables de entorno desde archivos en la raíz del proyecto
    env_file:
      - ../config-main.env
      - ../config-sip.env
    ports:
      - "8080:8080"    # OPAC
      - "8081:8081"    # Intranet
    networks:
      - koha
    cap_add:
      - DAC_READ_SEARCH
      - SYS_NICE
    # Elimina bloques environment para evitar conflictos con env_file
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      memcached:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  rabbitmq:
    image: docker.io/rabbitmq:3
    volumes:
      - ./rabbitmq_plugins:/etc/rabbitmq/enabled_plugins
    networks:
      - koha
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      retries: 5

  db:
    image: docker.io/mariadb:11
    volumes:
      - mariadb-koha:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: example
      MARIADB_DATABASE: koha_teolib
      MARIADB_USER: koha_teolib
      MARIADB_PASSWORD: example
    networks:
      - koha
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3

  memcached:
    image: docker.io/memcached
    networks:
      - koha

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    environment:
      - discovery.type=single-node
      - network.host=0.0.0.0
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - koha
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:9200"]
      interval: 10s
      retries: 5

volumes:
  mariadb-koha:
  esdata:

networks:
  koha:

