version: "3.9"
services:
  koha:
    image: teogramm/koha:24.11
    ports:
      - 8080:8080
      - 8081:8081
    networks:
      - koha
    cap_add:
      - DAC_READ_SEARCH
      - SYS_NICE
    environment:
      MYSQL_SERVER: db
      MYSQL_USER: koha_teolib
      MYSQL_PASSWORD: example
      DB_NAME: koha_teolib
      MEMCACHED_SERVERS: memcached:11211
      MB_HOST: rabbitmq
    depends_on:
      - db
      - rabbitmq
      - memcached

  rabbitmq:
      image: docker.io/rabbitmq:3
      volumes:
        - ./rabbitmq_plugins:/etc/rabbitmq/enabled_plugins
      networks:
        - koha

  db:
    image: docker.io/mariadb:11
    volumes:
      - mariadb-koha:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: example
      MARIADB_DATABASE: koha_teolib
      MARIADB_USER: koha_teolib
      MARIADB_PASSWORD: example
    networks:
      - koha   
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping","-h","localhost"]
      interval: 10s
      retries: 5

  memcached:
    image: docker.io/memcached
    networks:
      - koha
      
  elasticsearch:
  image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
  environment:
    - discovery.type=single-node
    - network.host=0.0.0.0
    - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    - xpack.security.enabled=false
  ulimits:
    memlock:
      soft: -1; hard: -1
    nofile:
      soft: 65536; hard: 65536
  volumes:
    - esdata:/usr/share/elasticsearch/data

volumes:
  esdata:
 

volumes:
    mariadb-koha:

networks:
    koha:
